name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make release-local
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hello-*
            dist/SHA256SUMS
