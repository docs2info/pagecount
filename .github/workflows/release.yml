name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Includes TestNoNet, which runs `go list -deps` and so needs go on PATH.
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          set -e
          mkdir -p dist/stage
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=
              [ "$os" = windows ] && ext=.exe
              name="pagecount_${os}_${arch}"
              echo "build $os/$arch" >&2
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags="-s -w" -o "dist/stage/pagecount${ext}" .
              # Each archive holds pagecount[.exe] and LICENSE; tar keeps the execute bit.
              cp LICENSE dist/stage/LICENSE
              if [ "$os" = windows ]; then
                (cd dist/stage && zip -qX "../${name}.zip" pagecount.exe LICENSE)
              else
                chmod 755 dist/stage/pagecount
                tar -czf "dist/${name}.tar.gz" -C dist/stage pagecount LICENSE
              fi
              rm -f "dist/stage/pagecount${ext}" dist/stage/LICENSE
            done
          done
          rmdir dist/stage
      # Bare filenames, so `sha256sum -c checksums.txt` works beside the downloaded archives.
      - name: checksums
        run: cd dist && sha256sum pagecount_* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
